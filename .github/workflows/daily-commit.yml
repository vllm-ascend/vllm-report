name: Daily Commit Fetch & Analyze

on:
  schedule:
    # 北京时间凌晨 2:00 = UTC 18:00 (前一日)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, default: yesterday Beijing time)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    env:
      # key 走 secrets;公开参数走 vars(Settings → Secrets and variables → Actions → Variables)
      # 三个 vars 都可省略,省略时用默认 zhipu/glm-5.3-flash — 切换模型只改这些变量,不改代码
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for opencode Phase 2)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Configure opencode
        run: |
          MODEL_SPEC="${LLM_MODEL:-zhipu/glm-5.3-flash}"
          PROVIDER_ID="${MODEL_SPEC%%/*}"
          MODEL_ID="${MODEL_SPEC#*/}"
          API_BASE="${LLM_API_BASE:-https://open.bigmodel.cn/api/paas/v4}"
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "${PROVIDER_ID}/${MODEL_ID}",
            "provider": {
              "${PROVIDER_ID}": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "${PROVIDER_ID}",
                "options": {
                  "baseURL": "${API_BASE}",
                  "apiKey": "{env:LLM_API_KEY}"
                },
                "models": {
                  "${MODEL_ID}": {
                    "name": "${MODEL_ID}"
                  }
                }
              }
            }
          }
          EOF

      - name: Add MCP Server for opencode
        run: |
          opencode mcp add vllm-report \
            -- python -m src.mcp_server_app \
            --data-dir "${{ github.workspace }}/data" \
            --ascend-repo-path "${{ github.workspace }}/repos/vllm-ascend"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compute date (Beijing time, or from workflow input)
        id: date
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout vllm source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          path: repos/vllm
          fetch-depth: 0

      - name: Checkout vllm-ascend source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          path: repos/vllm-ascend
          fetch-depth: 0

      - name: Fetch vllm commits
        run: >-
          python src/data/fetch_commits.py
          --repo vllm-project/vllm
          --local-repo repos/vllm
          --date "${{ steps.date.outputs.date }}"
          --force

      - name: Analyze vllm commits (Phase 1)
        run: |
          if [ -f "data/vllm/commits/${{ steps.date.outputs.date }}.json" ]; then
            python src/data/analyze_commits.py \
              --repo vllm-project/vllm \
              --date "${{ steps.date.outputs.date }}" \
              --local-repo repos/vllm \
              --data-dir data \
              --force
          else
            echo "No commit data for ${{ steps.date.outputs.date }}, skipping analysis"
          fi

      - name: Deep analyze vllm commits (Phase 2)
        run: |
          if [ -f "data/vllm/analysis/${{ steps.date.outputs.date }}.json" ]; then
            python src/data/deep_analyze_commits.py \
              --repo vllm-project/vllm \
              --date "${{ steps.date.outputs.date }}" \
              --local-repo repos/vllm \
              --data-dir data
          fi

      - name: Fetch vllm-ascend commits
        run: >-
          python src/data/fetch_commits.py
          --repo vllm-project/vllm-ascend
          --local-repo repos/vllm-ascend
          --date "${{ steps.date.outputs.date }}"
          --force

      - name: Analyze vllm-ascend commits
        run: |
          if [ -f "data/vllm-ascend/commits/${{ steps.date.outputs.date }}.json" ]; then
            python src/data/analyze_commits.py \
              --repo vllm-project/vllm-ascend \
              --date "${{ steps.date.outputs.date }}" \
              --local-repo repos/vllm-ascend \
              --data-dir data \
              --force
          else
            echo "No commit data for ${{ steps.date.outputs.date }}, skipping analysis"
          fi

      # Clean (orphans + 2-week retention) BEFORE build_index/init so the
      # index and adaptation status only reflect surviving files. Protected
      # dates (baseline, tracked commits) are read from the committed
      # adaptation-status.json and survive the window.
      - name: Clean stale data (orphans + 2-week retention)
        run: python .github/scripts/clean_stale_data.py --data-dir data --retention-days 14

      - name: Build search index
        run: python src/data/build_index.py --data-dir data

      - name: Track adaptation
        run: python src/data/track_adaptation.py init --ascend-repo-path repos/vllm-ascend --data-dir data --local-repo repos/vllm --force

      - name: Track PR CI results (main2main PRs, last 7 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/data/track_pr_ci.py --data-dir data --days 7

      - name: Commit and push changes
        run: >-
          git config user.name "github-actions[bot]"
          && git config user.email "github-actions[bot]@users.noreply.github.com"
          && git add data/
          && git diff --staged --quiet
          || (git commit -m "chore: update data $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          && git push)