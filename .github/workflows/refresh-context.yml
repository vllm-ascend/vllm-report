name: Refresh Architecture Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Code
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << 'EOF'
          {
            "env": {
              "ANTHROPIC_AUTH_TOKEN": "${{ secrets.CLAUDE_AUTH_TOKEN }}",
              "ANTHROPIC_BASE_URL": "${{ secrets.CLAUDE_BASE_URL }}",
              "ANTHROPIC_MODEL": "${{ secrets.CLAUDE_MODEL }}",
              "ANTHROPIC_SMALL_FAST_MODEL": "${{ secrets.CLAUDE_SMALL_FAST_MODEL }}",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
              "API_TIMEOUT_MS": "600000"
            }
          }
          EOF

      - name: Add MCP Server for Claude Code
        run: |
          claude mcp add vllm-report -s user -- python -m src.mcp_server_app \
            --data-dir "${{ github.workspace }}/data" \
            --ascend-repo-path "${{ github.workspace }}/repos/vllm-ascend"

      - name: Checkout vllm source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          path: repos/vllm
          fetch-depth: 0

      - name: Checkout vllm-ascend source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          path: repos/vllm-ascend
          fetch-depth: 0

      - name: Generate vllm architecture context
        run: python src/data/generate_context.py --repo vllm-project/vllm --force --data-dir data --local-repo repos/vllm

      - name: Generate vllm-ascend architecture context
        run: python src/data/generate_context.py --repo vllm-project/vllm-ascend --force --data-dir data --local-repo repos/vllm-ascend

      - name: Cross-reference vllm vs vllm-ascend
        run: python src/data/generate_context.py --cross-reference --force --data-dir data --local-repo repos/vllm

      - name: Rebuild search index
        run: python src/data/build_index.py --data-dir data

      - name: Track adaptation
        run: python src/data/track_adaptation.py init \
          --ascend-repo-path repos/vllm-ascend \
          --data-dir data \
          --force

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update architecture context $(TZ=Asia/Shanghai date +%Y-%m-%d)" && git push)