name: Weekly Architecture Context

on:
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC = 08:00 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Checkout vllm source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          path: repos/vllm
          fetch-depth: 1

      - name: Checkout vllm-ascend source
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          path: repos/vllm-ascend
          fetch-depth: 1

      - name: Generate vllm architecture context
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_context.py --repo vllm-project/vllm --force --local-repo repos/vllm

      - name: Generate vllm-ascend architecture context
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_context.py --repo vllm-project/vllm-ascend --force --local-repo repos/vllm-ascend

      - name: Cross-reference vllm vs vllm-ascend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_context.py --cross-reference --force --local-repo repos/vllm

      - name: Rebuild search index
        run: python scripts/build_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update architecture context $(TZ=Asia/Shanghai date +%Y-%m-%d)" && git push)